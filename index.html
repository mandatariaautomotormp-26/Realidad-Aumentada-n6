<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realidad Aumentada | Sistemas y Organizaciones</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#encabezado{
position:fixed;z-index:100;top:16px;left:50%;transform:translateX(-50%);
width:calc(100% - 32px);max-width:520px;box-sizing:border-box;
padding:11px 18px;border-radius:16px;background:rgba(7,17,31,.82);
border:1px solid rgba(255,255,255,.18);color:white;text-align:center;
backdrop-filter:blur(10px);box-shadow:0 8px 25px rgba(0,0,0,.25);pointer-events:none
}
#encabezado .titulo{font-size:16px;font-weight:bold;letter-spacing:.3px}
#encabezado .subtitulo{margin-top:3px;font-size:12px;color:#d9e2ff}
#indicacion{
position:fixed;z-index:100;bottom:20px;left:50%;transform:translateX(-50%);
width:calc(100% - 40px);max-width:460px;box-sizing:border-box;
padding:12px 17px;border-radius:15px;background:rgba(7,17,31,.78);
border:1px solid rgba(255,255,255,.15);color:white;text-align:center;
font-size:13px;backdrop-filter:blur(9px);box-shadow:0 8px 25px rgba(0,0,0,.22);
pointer-events:none
}
#indicacion strong{display:block;margin-bottom:3px;font-size:14px}
</style>
</head>

<body>

<div id="encabezado">
  <div class="titulo">🏢 Sistemas y Organizaciones</div>
  <div class="subtitulo">Realidad aumentada · Modelo organizacional 3D</div>
</div>

<div id="indicacion">
  <strong>🔎 Escaneá la imagen</strong>
  Apuntá la cámara hacia el proyecto para visualizar la maqueta.
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="objetivo" mindar-image-target="targetIndex: 0">

    <a-cylinder
      position="0 -0.03 0"
      radius="0.48"
      height="0.025"
      segments-radial="48"
      color="#101b35"
      opacity="0.55"
      transparent="true">
    </a-cylinder>

    <a-gltf-model
      src="./result.glb"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>

    <a-light type="ambient" intensity="2"></a-light>

    <a-light
      type="directional"
      position="1 3 2"
      intensity="2">
    </a-light>

  </a-entity>
</a-scene>

<script>
const objetivo = document.querySelector("#objetivo");
const subtitulo = document.querySelector("#encabezado .subtitulo");
const indicacion = document.querySelector("#indicacion");

objetivo.addEventListener("targetFound", function () {
  subtitulo.textContent = "✓ Imagen reconocida · Maqueta 3D activa";
  indicacion.innerHTML =
    "<strong>✨ Realidad aumentada activa</strong>" +
    "Mové lentamente el celular para explorar la maqueta.";
});

objetivo.addEventListener("targetLost", function () {
  subtitulo.textContent = "Realidad aumentada · Modelo organizacional 3D";
  indicacion.innerHTML =
    "<strong>🔎 Escaneá la imagen</strong>" +
    "Apuntá nuevamente hacia el proyecto.";
});
</script>

</body>
</html>
