<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Realidad Aumentada | Sistemas y Organizaciones</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #050816;
    }

    .pantalla-inicio {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #07111f, #101b35);
      color: white;
      text-align: center;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    .panel h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }

    .panel p {
      line-height: 1.6;
      color: #d9e2ff;
    }

    .boton {
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #101b35;
    }

    .boton:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #estadoInicio {
      margin-top: 15px;
      min-height: 20px;
      color: #cbd7f5;
      font-size: 13px;
    }

    #estadoAR {
      position: fixed;
      z-index: 900;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 520px;
      box-sizing: border-box;
      padding: 13px 18px;
      border-radius: 14px;
      background: rgba(5, 8, 22, 0.82);
      color: white;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- PANTALLA INICIAL -->
  <div id="inicio" class="pantalla-inicio">

    <div class="panel">

      <h1>📱 Realidad Aumentada</h1>

      <p>
        <strong>Sistemas y Organizaciones</strong>
      </p>

      <p>
        Apuntá la cámara hacia la imagen del proyecto
        para visualizar la maqueta en 3D.
      </p>

      <button id="botonInicio" class="boton" disabled>
        Preparando...
      </button>

      <div id="estadoInicio">
        Cargando el sistema de realidad aumentada...
      </div>

    </div>

  </div>


  <!-- MENSAJE DURANTE LA REALIDAD AUMENTADA -->

  <div id="estadoAR">
    📷 Iniciando cámara...
  </div>


  <!-- ESCENA AR -->

  <a-scene
    id="escena"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- IMAGEN OBJETIVO -->

    <a-entity
      id="objetivo"
      mindar-image-target="targetIndex: 0">


      <!-- MODELO 3D -->

      <a-gltf-model
        id="modelo3D"
        src="./result.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>


      <!-- LUCES -->

      <a-light
        type="ambient"
        intensity="1.8">
      </a-light>

      <a-light
        type="directional"
        position="1 3 2"
        intensity="2">
      </a-light>


    </a-entity>

  </a-scene>


  <!-- JAVASCRIPT -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const escena =
        document.querySelector("#escena");

      const objetivo =
        document.querySelector("#objetivo");

      const inicio =
        document.querySelector("#inicio");

      const boton =
        document.querySelector("#botonInicio");

      const estadoInicio =
        document.querySelector("#estadoInicio");

      const estadoAR =
        document.querySelector("#estadoAR");


      let arSystem = null;


      /*
       * ESPERAMOS A QUE A-FRAME TERMINE DE CARGAR
       */

      escena.addEventListener("loaded", function () {

        arSystem =
          escena.systems["mindar-image-system"];


        if (!arSystem) {

          estadoInicio.textContent =
            "No se pudo cargar el sistema MindAR.";

          boton.textContent = "Error";

          return;
        }


        boton.disabled = false;

        boton.textContent =
          "Iniciar realidad aumentada";

        estadoInicio.textContent =
          "Sistema listo.";

      });


      /*
       * MINDAR AVISA CUANDO LA CÁMARA
       * Y EL MOTOR AR ESTÁN LISTOS
       */

      escena.addEventListener("arReady", function () {

        estadoAR.innerHTML =
          "📷 <strong>Cámara activa</strong><br>" +
          "🔎 Buscando la imagen del proyecto...";

        estadoAR.style.display = "block";

      });


      /*
       * ERROR AL INICIAR LA CÁMARA
       */

      escena.addEventListener("arError", function () {

        estadoAR.innerHTML =
          "⚠️ <strong>No se pudo iniciar la cámara.</strong><br>" +
          "Comprobá el permiso de cámara del navegador.";

        estadoAR.style.display = "block";


        inicio.style.display = "flex";

        boton.disabled = false;

        boton.textContent =
          "Intentar nuevamente";

        estadoInicio.textContent =
          "MindAR no pudo iniciar la cámara.";

      });


      /*
       * IMAGEN RECONOCIDA
       */

      objetivo.addEventListener("targetFound", function () {

        estadoAR.innerHTML =
          "✅ <strong>Imagen reconocida</strong><br>" +
          "✨ Mostrando la maqueta 3D.";

        estadoAR.style.display = "block";

      });


      /*
       * IMAGEN PERDIDA
       */

      objetivo.addEventListener("targetLost", function () {

        estadoAR.innerHTML =
          "🔎 <strong>Buscando la imagen...</strong><br>" +
          "Apuntá nuevamente hacia la imagen del proyecto.";

        estadoAR.style.display = "block";

      });


      /*
       * BOTÓN INICIAR
       */

      boton.addEventListener("click", function () {

        if (!arSystem) {

          estadoInicio.textContent =
            "El sistema todavía está cargando...";

          return;
        }


        boton.disabled = true;

        inicio.style.display = "none";


        estadoAR.innerHTML =
          "📷 <strong>Iniciando cámara...</strong><br>" +
          "Esperá unos segundos.";

        estadoAR.style.display = "block";


        try {

          arSystem.start();

        } catch (error) {

          console.error(error);


          inicio.style.display = "flex";

          boton.disabled = false;

          boton.textContent =
            "Intentar nuevamente";

          estadoInicio.textContent =
            "No se pudo iniciar la cámara.";

        }

      });

    });

  </script>

</body>
</html>
