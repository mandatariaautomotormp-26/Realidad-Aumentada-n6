<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Realidad Aumentada</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- TARGET -->

    <a-entity
      mindar-image-target="targetIndex: 0">


      <!-- BASE VISUAL -->

      <a-cylinder
        position="0 -0.05 0"
        radius="0.55"
        height="0.025"
        segments-radial="48"
        color="#18243d"
        opacity="0.75"
        transparent="true">
      </a-cylinder>


      <!-- MODELO 3D -->

      <a-gltf-model
        src="./result.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>


      <!-- LUZ -->

      <a-light
        type="ambient"
        intensity="2">
      </a-light>


      <a-light
        type="directional"
        position="1 3 2"
        intensity="2">
      </a-light>


    </a-entity>

  </a-scene>

</body>

</html>
