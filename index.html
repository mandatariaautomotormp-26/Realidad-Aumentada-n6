
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Realidad Aumentada | Sistemas y Organizaciones</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #050816;
    }

    #inicio {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #07111f, #101b35);
      color: white;
      text-align: center;
      padding: 25px;
    }

    .panel {
      max-width: 430px;
      padding: 30px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    .panel h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .panel p {
      line-height: 1.6;
      color: #d9e2ff;
    }

    .boton {
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #101b35;
    }

    #info {
      position: fixed;
      z-index: 5;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 500px;
      padding: 12px 18px;
      box-sizing: border-box;
      border-radius: 14px;
      background: rgba(5, 8, 22, 0.78);
      color: white;
      text-align: center;
      font-size: 14px;
      backdrop-filter: blur(8px);
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla inicial -->
  <div id="inicio">
    <div class="panel">
      <h1>📱 Realidad Aumentada</h1>

      <p>
        Sistemas y Organizaciones
      </p>

      <p>
        Apuntá la cámara hacia la imagen del proyecto
        para visualizar la maqueta en 3D.
      </p>

      <button class="boton" onclick="iniciarRA()">
        Iniciar realidad aumentada
      </button>
    </div>
  </div>

  <!-- Indicaciones -->
  <div id="info">
    🔎 Apuntá la cámara hacia la imagen del proyecto
  </div>

  <!-- ESCENA AR -->
  <a-scene
    id="escena"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagen objetivo -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- MODELO 3D -->
      <a-gltf-model
        src="./result.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>

      <!-- Luz principal -->
      <a-light
        type="ambient"
        intensity="1.8">
      </a-light>

      <a-light
        type="directional"
        position="1 3 2"
        intensity="2">
      </a-light>

    </a-entity>

  </a-scene>

  <script>
    async function iniciarRA() {

      const inicio = document.getElementById("inicio");
      const info = document.getElementById("info");
      const escena = document.getElementById("escena");

      inicio.style.display = "none";
      info.style.display = "block";

      const sistema = escena.systems["mindar-image-system"];

      try {
        await sistema.start();

        console.log("Realidad aumentada iniciada");

      } catch (error) {

        console.error("Error al iniciar la cámara:", error);

        inicio.style.display = "flex";
        info.style.display = "none";

        alert(
          "No se pudo iniciar la cámara. " +
          "Verificá que hayas permitido el acceso a la cámara."
        );
      }
    }

    const escena = document.getElementById("escena");

    escena.addEventListener("targetFound", () => {

      document.getElementById("info").innerHTML =
        "✅ Imagen reconocida — ¡mové lentamente el celular!";

    });

    escena.addEventListener("targetLost", () => {

      document.getElementById("info").innerHTML =
        "🔎 Apuntá nuevamente hacia la imagen del proyecto";

    });
  </script>

</body>
</html>
